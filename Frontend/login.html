<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
	<link href="css/login.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-dark top-bar px-3">
		<div class="d-flex gap-2 app-title">
			<span class="fw-semibold">Bienvenido</span>
		</div>
	</nav>

	<main class="container-fluid login-page">
		<div class="row align-items-center min-vh-100 gx-0">
			<!-- Formulario de inicio de sesión -->
			<div class="col-12 col-md-6 d-flex justify-content-center">
				<div class="login-panel">
					<h2 class="login-title">Iniciar sesión</h2>
					<form class="mt-4" id="loginForm" action="#" method="post">
						<div class="mb-3">
							<input id="txtUser" name="username" type="text" class="form-control form-control-lg" placeholder="Usuario" required>
						</div>
						<div class="mb-3 position-relative">
							<input id="txtPassword" name="password" type="password" class="form-control form-control-lg" placeholder="Contraseña" required>
						</div>
						<div class="mb-3 text-start">
							<button class="btn btn-primary btn-lg px-4" type="submit"><i class="fa fa-sign-in-alt me-2"></i>Ingresar</button>
						</div>
					</form>
				</div>
			</div>

			<!-- Imagen de inicio de sesión -->
			<div class="col-12 col-md-6 d-none d-md-flex justify-content-center">
				<div class="login-illustration-wrap">
					<img id="loginIllustration" src="https://res.cloudinary.com/dt8ulsehy/image/upload/image-removebg-preview_qmxpfq" alt="Ilustración" class="img-fluid placeholder-img" />
				</div>
			</div>
		</div>
	</main>

	<script>
			// Placeholder logic for the illustration (the password visibility button was removed)
			(function(){
				const img = document.getElementById('loginIllustration');
				const placeholder = document.getElementById('illustrationPlaceholder');
				function refreshIllustration(){
					if(!img) return;
					const srcAttr = img.getAttribute('src');
					if(srcAttr && srcAttr.trim() !== ""){
						img.classList.remove('d-none');
						if(placeholder) placeholder.classList.add('d-none');
					} else {
						img.classList.add('d-none');
						if(placeholder) placeholder.classList.remove('d-none');
					}
				}
				// run on load
				refreshIllustration();
			})();
	</script>

</body>
</html>
